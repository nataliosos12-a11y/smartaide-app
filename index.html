    function App() {

      const [selectedInstitution, setSelectedInstitution] = useState(null);
      const [filterNeighborhood, setFilterNeighborhood] = useState('all');
      const [filterType, setFilterType] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      // Modals
      const [modalType, setModalType] = useState(null); // 'student' | 'aide' | 'relocate' | null
      const [activeAideToRelocate, setActiveAideToRelocate] = useState(null);

      // Form States
      const [reportedInstId, setReportedInstId] = useState(ALL_INSTITUTIONS[0].id);
      const [absenceReason, setAbsenceReason] = useState('מחלה');
      const [absenceUntil, setAbsenceUntil] = useState('22/09');
      const [notificationToast, setNotificationToast] = useState(null);

      // Leaflet Map Refs
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);

      const showToast = (msg) => {
        setNotificationToast(msg);
        setTimeout(() => setNotificationToast(null), 4000);
      };

      // Initialize Real Leaflet Map
      useEffect(() => {
        if (!mapInstanceRef.current && mapContainerRef.current) {
          // Kiryat Bialik Center Coordinates
          const map = L.map(mapContainerRef.current, {
            zoomControl: true,
            scrollWheelZoom: true
          }).setView([32.8340, 35.0880], 14);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors | קריית ביאליק',
            maxZoom: 18,
          }).addTo(map);

          markersLayerRef.current = L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      // Render Pins on Map whenever institutions or filters change
      useEffect(() => {
        if (!mapInstanceRef.current || !markersLayerRef.current) return;

        markersLayerRef.current.clearLayers();

        institutions.forEach(inst => {
          // Check if matches filters
          const matchNeighborhood = filterNeighborhood === 'all' || inst.neighborhood === filterNeighborhood;
          const matchType = filterType === 'all' || inst.type === filterType;
          const matchStatus = filterStatus === 'all' || inst.status === filterStatus;
          const matchSearch = 
            inst.name.includes(searchQuery) ||
            inst.street.includes(searchQuery) ||
            inst.aideName.includes(searchQuery) ||
            inst.studentOrTarget.includes(searchQuery);

          if (!matchNeighborhood || !matchType || !matchStatus || !matchSearch) return;

          let colorClass = 'pin-green';
          let symbol = '✓';
          if (inst.status === 'shortage') {
            colorClass = 'pin-red';
            symbol = '!';
          } else if (inst.status === 'freed') {
            colorClass = 'pin-blue';
            symbol = '⚡';
          }

          const icon = L.divIcon({
            className: '',
            html: `<div class="custom-div-pin ${colorClass}" style="width: 28px; height: 28px;">${symbol}</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14],
          });

          const marker = L.marker([inst.lat, inst.lng], { icon });

          marker.bindTooltip(`
            <div dir="rtl" style="font-family: Rubik, sans-serif; text-align: right;">
              <strong>${inst.type} ${inst.name}</strong><br/>
              <span style="font-size: 11px; color: #475569;">${inst.street} (${inst.neighborhood})</span><br/>
              <span style="font-size: 10px; font-weight: bold; color: ${inst.status === 'shortage' ? '#dc2626' : inst.status === 'freed' ? '#2563eb' : '#16a34a'};">
                ${inst.status === 'shortage' ? 'חוסר בסייעת' : inst.status === 'freed' ? 'סייעת פנויה לניוד' : 'מאוזן ומאויש'}
              </span>
            </div>
          `, { direction: 'top', offset: [0, -10] });

          marker.on('click', () => {
            setSelectedInstitution(inst);
            mapInstanceRef.current.setView([inst.lat, inst.lng], 16, { animate: true });
          });

          markersLayerRef.current.addLayer(marker);
        });
      }, [institutions, filterNeighborhood, filterType, filterStatus, searchQuery]);

      // Focus map on item click from table
      const focusOnInstitution = (inst) => {
        setSelectedInstitution(inst);
        if (mapInstanceRef.current) {
          mapInstanceRef.current.setView([inst.lat, inst.lng], 16, { animate: true });
        }
      };

      // Handling Student Absence (Frees Aide)
      const handleStudentReportSubmit = (e) => {
        e.preventDefault();
        setInstitutions(prev => prev.map(inst => {
          if (inst.id === reportedInstId) {
            return {
              ...inst,
              status: 'freed',
              absenceDetail: `תלמיד נעדר (${absenceReason}) עד ${absenceUntil}`
            };
          }
          return inst;

            </div>
          )}

          {/* MODAL 3: Relocation Dispatcher with Instant WhatsApp Alert */}
          {modalType === 'relocate' && activeAideToRelocate && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 animate-fadeIn">
                <div className="flex items-center justify-between border-b pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-900">
                      שיבוץ וניוד מהיר: {activeAideToRelocate.aideName}
                    </h3>
                    <p className="text-xs text-slate-500">
                      מוסד מקור: {activeAideToRelocate.name} ({activeAideToRelocate.neighborhood})
                    </p>
                  </div>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="space-y-2 text-xs max-h-96 overflow-y-auto pr-1">
                  <span className="font-bold text-slate-700 block">בחר/י לאיזה מוסד בחוסר לשבץ אותה:</span>
                  
                  {institutions.filter(i => i.status === 'shortage').length === 0 ? (
                    <div className="p-4 bg-emerald-50 text-emerald-800 rounded-2xl text-center font-bold">
                      🎉 כל הגנים ובתי הספר בקריית ביאליק מאוישים במלואם!
                    </div>
                  ) : (
                    institutions.filter(i => i.status === 'shortage').map(shortageInst => (
                      <div
                        key={shortageInst.id}
                        className="bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-2xl p-3 flex items-center justify-between transition"
                      >
                        <div>
                          <h4 className="font-bold text-slate-900 text-sm">{shortageInst.type} {shortageInst.name}</h4>
                          <p className="text-slate-500">{shortageInst.street} ({shortageInst.neighborhood})</p>
                          <p className="text-rose-600 font-medium text-[11px] mt-0.5">{shortageInst.absenceDetail}</p>
                          <p className="text-slate-600 text-[11px]">איש קשר: {shortageInst.leadStaff} ({shortageInst.staffPhone})</p>
                        </div>

                        <button
                          onClick={() => handleDirectRelocation(activeAideToRelocate, shortageInst)}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2 rounded-xl shadow transition text-xs flex items-center gap-1.5"
                        >
                          <span>שבץ ופתח WhatsApp</span>
                          <span>🚀</span>
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
