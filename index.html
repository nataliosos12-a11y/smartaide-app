<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartAide-Opt | מערכת חכמה לניוד סייעות שילוב ורפואיות</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Assistant & Rubik for clean Hebrew typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Rubik', 'Assistant', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              800: '#1e3a8a',
              900: '#0f172a',
            },
            emeraldAccent: '#10b981',
            roseAlert: '#f43f5e',
            amberWarning: '#f59e0b',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Rubik', 'Assistant', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    /* Smooth custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .pulsing-dot {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Cost per external replacement aide per day in ILS (חיסכון כספי למחלקת החינוך)
    const REPLACEMENT_AIDE_COST_PER_DAY = 480;

    // Initial Kindergartens across municipality zones
    const INITIAL_KINDERGARTENS = [
      { id: 'k_1', name: 'גן שושנים', zone: 'צפון העיר', address: 'רחוב העצמאות 12', x: 25, y: 30, needs: 0, requiredRole: null, status: 'balanced' },
      { id: 'k_2', name: 'גן רקפות', zone: 'מרכז העיר', address: 'שדרות ירושלים 45', x: 50, y: 45, needs: 1, requiredRole: 'medical', status: 'shortage' },
      { id: 'k_3', name: 'גן אלונים', zone: 'מערב העיר', address: 'דרך הים 8', x: 18, y: 70, needs: 1, requiredRole: 'inclusion', status: 'shortage' },
      { id: 'k_4', name: 'גן דקלים', zone: 'דרום העיר', address: 'רחוב הפרחים 3', x: 75, y: 80, needs: 0, requiredRole: null, status: 'balanced' },
      { id: 'k_5', name: 'גן ארזים', zone: 'צפון-מזרח', address: 'משעול השקד 19', x: 80, y: 25, needs: 1, requiredRole: 'medical', status: 'shortage' },
      { id: 'k_6', name: 'גן תמר', zone: 'מרכז העיר', address: 'רחוב הרצל 82', x: 55, y: 55, needs: 0, requiredRole: null, status: 'balanced' },
      { id: 'k_7', name: 'גן חבצלת', zone: 'דרום-מערב', address: 'הנביאים 14', x: 35, y: 85, needs: 0, requiredRole: null, status: 'balanced' },
    ];

    // Initial Anonymized Children with Medical & Inclusion needs
    const INITIAL_CHILDREN = [
      { id: 'Child_101', codeName: 'תלמיד/ה #101', kindergartenId: 'k_1', needType: 'medical', needDescription: 'ליווי רפואי רציף (סוכרת נעורים + ניטור סוכר)', aideAssignedId: 'aide_1', isAbsent: false, absenceReason: '' },
      { id: 'Child_102', codeName: 'תלמיד/ה #102', kindergartenId: 'k_2', needType: 'medical', needDescription: 'אלרגיה מסכנת חיים + השגחה צמודה במזון', aideAssignedId: null, isAbsent: false, absenceReason: '' },
      { id: 'Child_103', codeName: 'תלמיד/ה #103', kindergartenId: 'k_3', needType: 'inclusion', needDescription: 'שילוב אישי (תקשורת וקשב ASD)', aideAssignedId: null, isAbsent: false, absenceReason: '' },
      { id: 'Child_104', codeName: 'תלמיד/ה #104', kindergartenId: 'k_4', needType: 'inclusion', needDescription: 'שילוב מיומנויות תנועה וליווי פדגוגי', aideAssignedId: 'aide_2', isAbsent: false, absenceReason: '' },
      { id: 'Child_105', codeName: 'תלמיד/ה #105', kindergartenId: 'k_5', needType: 'medical', needDescription: 'טיפול רפואי נשימתי וניטור', aideAssignedId: null, isAbsent: false, absenceReason: '' },
      { id: 'Child_106', codeName: 'תלמיד/ה #106', kindergartenId: 'k_6', needType: 'inclusion', needDescription: 'שילוב רגשי-התנהגותי מותאם', aideAssignedId: 'aide_3', isAbsent: false, absenceReason: '' },
      { id: 'Child_107', codeName: 'תלמיד/ה #107', kindergartenId: 'k_7', needType: 'medical', needDescription: 'השגחה רפואית אפילפסיה וערנות', aideAssignedId: 'aide_4', isAbsent: false, absenceReason: '' },
    ];

    // Dedicated Aides with Certifications
    const INITIAL_AIDES = [
      { id: 'aide_1', name: 'מיכל כהן', phone: '050-1234567', homeKindergartenId: 'k_1', currentAssignedKidId: 'Child_101', assignedKindergartenId: 'k_1', certifications: ['medical', 'inclusion'], status: 'assigned', confirmedArrival: true },
      { id: 'aide_2', name: 'רונית לוי', phone: '052-7654321', homeKindergartenId: 'k_4', currentAssignedKidId: 'Child_104', assignedKindergartenId: 'k_4', certifications: ['inclusion'], status: 'assigned', confirmedArrival: true },
      { id: 'aide_3', name: 'אורלי שטרן', phone: '054-9876543', homeKindergartenId: 'k_6', currentAssignedKidId: 'Child_106', assignedKindergartenId: 'k_6', certifications: ['medical', 'inclusion'], status: 'assigned', confirmedArrival: true },
      { id: 'aide_4', name: 'שרה ברקוביץ', phone: '053-1122334', homeKindergartenId: 'k_7', currentAssignedKidId: 'Child_107', assignedKindergartenId: 'k_7', certifications: ['medical'], status: 'assigned', confirmedArrival: true },
    ];

    // Weekly Predictive Model Data (Machine Learning Forecast)
    const FORECAST_DATA = [
      { day: 'יום א׳ (היום)', riskLevel: 'גבוה', probPercent: 32, predictedAbsences: 3, note: 'שכיחות גבוהה להיעדרויות תחילת שבוע' },
      { day: 'יום ב׳ (מחר)', riskLevel: 'בינוני', probPercent: 18, predictedAbsences: 1, note: 'יציבות צפויה במרכז ובצפון העיר' },
      { day: 'יום ג׳', riskLevel: 'נמוך', probPercent: 12, predictedAbsences: 1, note: 'מגמת נוכחות יציבה' },
      { day: 'יום ד׳', riskLevel: 'בינוני', probPercent: 22, predictedAbsences: 2, note: 'צפי גשמים והתקררות - עליה בתחלואה' },
      { day: 'יום ה׳', riskLevel: 'גבוה', probPercent: 28, predictedAbsences: 3, note: 'היעדרויות לקראת סופשבוע' },
    ];

    function App() {
      // Active navigation tab
      const [activeTab, setActiveTab] = useState('admin'); // 'admin' | 'parent' | 'aide' | 'academic'

      // Master States
      const [kindergartens, setKindergartens] = useState(INITIAL_KINDERGARTENS);
      const [children, setChildren] = useState(INITIAL_CHILDREN);
      const [aides, setAides] = useState(INITIAL_AIDES);
      const [systemLogs, setSystemLogs] = useState([
        { time: '06:45', text: 'מערכת SmartAide-Opt סונכרנה בהצלחה מול אגף החינוך.', type: 'info' },
        { time: '07:00', text: 'זוהו 3 גנים בעיר עם חוסר בסייעת שילוב/רפואית פתוח.', type: 'warning' },
      ]);

      // Optimization recommendations generated by algorithm
      const [recommendations, setRecommendations] = useState([]);
      const [isOptimizing, setIsOptimizing] = useState(false);
      const [notificationToast, setNotificationToast] = useState(null);

      // Toast auto-clear
      useEffect(() => {
        if (notificationToast) {
          const timer = setTimeout(() => setNotificationToast(null), 4000);
          return () => clearTimeout(timer);
        }
      }, [notificationToast]);

      const showToast = (message, type = 'success') => {
        setNotificationToast({ message, type });
      };

      const handleReportAbsence = (childId, reason, dateRange) => {
        const updatedChildren = children.map(c => {
          if (c.id === childId) {
            return { ...c, isAbsent: true, absenceReason: reason };
          }
          return c;
        });
        setChildren(updatedChildren);

        // Find assigned aide
        const targetChild = children.find(c => c.id === childId);
        if (targetChild && targetChild.aideAssignedId) {
          const assignedAideId = targetChild.aideAssignedId;

          // Free up this aide!
          const updatedAides = aides.map(a => {
            if (a.id === assignedAideId) {
              return {
                ...a,
                status: 'available', // Freed up for reassignment!
                currentAssignedKidId: null,
                confirmedArrival: false
              };
            }
            return a;
          });
          setAides(updatedAides);

          // Update source kindergarten status
          const sourceKg = kindergartens.find(k => k.id === targetChild.kindergartenId);

          const newLog = {
            time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }),
            text: `התקבל דיווח הורים: ${targetChild.codeName} מ${sourceKg?.name || 'הגן'} נעדר/ת (${reason}). הסייעת שוחררה לניוד מיידי!`,
            type: 'alert'
          };
          setSystemLogs(prev => [newLog, ...prev]);

          showToast(`דיווח ההיעדרות נקלט בהצלחה! הסייעת בגן שוחררה לניוד חכם.`, 'success');
        } else {
          showToast(`ההיעדרות דווחה. לתלמיד/ה זה לא הוקצתה סייעת פעילה הבוקר.`, 'info');
        }
      };

      const runOptimizationAlgorithm = () => {
        setIsOptimizing(true);

        setTimeout(() => {
          // Identify available aides
          const availableAides = aides.filter(a => a.status === 'available');

          // Identify kindergartens in shortage
          const shortageKgs = kindergartens.filter(k => k.status === 'shortage');

          const proposedMatches = [];

          // Constraint Satisfaction Logic (Hard: Certifications, Soft: Distance)
          availableAides.forEach(aide => {
            let bestMatch = null;
            let highestScore = -1;

            const homeKg = kindergartens.find(k => k.id === aide.homeKindergartenId);

            shortageKgs.forEach(kg => {
              // Already tentatively matched in this run?
              if (proposedMatches.some(m => m.targetKgId === kg.id)) return;

              // HARD CONSTRAINT: Check certification
              const needsMedical = kg.requiredRole === 'medical';
              const canHandle = needsMedical
                ? aide.certifications.includes('medical')
                : (aide.certifications.includes('inclusion') || aide.certifications.includes('medical'));

              if (!canHandle) return; // Incompatible certification

              // SOFT CONSTRAINT: Calculate Euclidean distance
              const dx = (kg.x - (homeKg ? homeKg.x : 50));
              const dy = (kg.y - (homeKg ? homeKg.y : 50));
              const distanceKm = Math.round(Math.sqrt(dx * dx + dy * dy) * 0.1 * 10) / 10; // Scaled to ~km

              // Score calculation: 100 base - distance penalty + certification synergy
              let score = 100 - (distanceKm * 6);
              if (needsMedical && aide.certifications.includes('medical')) score += 5;
              score = Math.max(50, Math.min(99, Math.round(score)));

              if (score > highestScore) {
                highestScore = score;
                bestMatch = {
                  aideId: aide.id,
                  aideName: aide.name,
                  sourceKgId: aide.homeKindergartenId,
                  sourceKgName: homeKg ? homeKg.name : 'גן מקור',
                  targetKgId: kg.id,
                  targetKgName: kg.name,
                  targetKgAddress: kg.address,
                  requiredRole: kg.requiredRole,
                  distanceKm: Math.max(0.6, distanceKm),
                  matchScore: score,
                  justification: needsMedical
                    ? `התאמת הסמכה רפואית מלאה (ציון ${score}%) ומרחק הליכה/נסיעה קצר (${distanceKm} ק"מ)`
                    : `הסמכת שילוב מתאימה, זמן הגעה מוערך כ-${Math.round(distanceKm * 4 + 3)} דקות`,
                };
              }
            });

            if (bestMatch) {
              proposedMatches.push(bestMatch);
            }
          });

          setRecommendations(proposedMatches);
          setIsOptimizing(false);

          if (proposedMatches.length > 0) {
            showToast(`אלגוריתם הניוד הושלם: נמצאו ${proposedMatches.length} שידוכים אופטימליים!`, 'success');
          } else {
            showToast('לא נמצאו סייעות פנויות כרגע, או שאין חוסרים המותאמים להסמכות.', 'info');
          }
        }, 800);
      };

      const handleApproveMatch = (match) => {
        // Update aide status
        setAides(prev => prev.map(a => {
          if (a.id === match.aideId) {
            return {
              ...a,
              status: 'relocated',
              assignedKindergartenId: match.targetKgId,
              confirmedArrival: false
            };
          }
          return a;
        }));

        // Update target kindergarten status from shortage to balanced
        setKindergartens(prev => prev.map(k => {
          if (k.id === match.targetKgId) {
            return {
              ...k,
              status: 'balanced',
              needs: 0,
              requiredRole: null
            };
          }
          return k;
        }));

        // Remove from pending recommendations
        setRecommendations(prev => prev.filter(m => m.aideId !== match.aideId));

        const log = {
          time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }),
          text: `שיבוץ אושר: הסייעת ${match.aideName} נוידה מ${match.sourceKgName} אל ${match.targetKgName}. נשלחה התראת משימה בנייד.`,
          type: 'success'
        };
        setSystemLogs(prev => [log, ...prev]);
        showToast(`השיבוץ ל${match.targetKgName} אושר בהצלחה!`, 'success');
      };

      const handleAideConfirmArrival = (aideId) => {
        setAides(prev => prev.map(a => {
          if (a.id === aideId) {
            return { ...a, confirmedArrival: true };
          }
          return a;
        }));
        showToast('אישור הגעה עודכן במערכת העירונית בהצלחה!', 'success');
      };

      const totalActiveAides = aides.length;
      const availableForRelocation = aides.filter(a => a.status === 'available').length;
      const totalShortages = kindergartens.filter(k => k.status === 'shortage').length;
      const relocatedToday = aides.filter(a => a.status === 'relocated').length;
      const moneySavedToday = relocatedToday * REPLACEMENT_AIDE_COST_PER_DAY;

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          {/* Top Header & Role Switcher */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center space-x-3 space-x-reverse">
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xl shadow-md text-white border border-blue-400">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-bold tracking-tight">SmartAide-Opt</h1>
                    <span className="text-xs bg-blue-500/30 text-blue-300 font-semibold px-2 py-0.5 rounded-full border border-blue-400/40">
                      גרסה אקדמית 2026
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">מערכת AI עירונית לניוד חכם של סייעות שילוב ורפואיות בזמן אמת</p>
                </div>
              </div>

              {/* View Switcher Buttons */}
              <nav className="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700 text-sm overflow-x-auto">
                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all duration-150 flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'admin'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                  }`}
                >
                  <span>🏛️</span>
                  <span>לוח מנהל רשות</span>
                </button>

                <button
                  onClick={() => setActiveTab('parent')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all duration-150 flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'parent'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                  }`}
                >
                  <span>👨‍👩‍👧</span>
                  <span>ממשק הורים</span>
                </button>

                <button
                  onClick={() => setActiveTab('aide')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all duration-150 flex items-center gap-1.5 whitespace-nowrap relative ${
                    activeTab === 'aide'
                      ? 'bg-blue-600 text-white shadow-sm'
                      : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                  }`}
                >
                  <span>📱</span>
                  <span>ממשק סייעת</span>
                  {aides.some(a => a.status === 'relocated' && !a.confirmedArrival) && (
                    <span className="w-2 h-2 rounded-full bg-rose-500 absolute top-1 right-1 animate-ping"></span>
                  )}
                </button>

                <button
                  onClick={() => setActiveTab('academic')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition-all duration-150 flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'academic'
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                  }`}
                >
                  <span>🎓</span>
                  <span>סקירה לפרויקט גמר</span>
                </button>
              </nav>
            </div>
          </header>

          {/* Toast Notification */}
          {notificationToast && (
            <div className="fixed bottom-5 left-5 z-50 max-w-md bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-3 animate-bounce">
              <span className="text-xl">
                {notificationToast.type === 'success' ? '✅' : notificationToast.type === 'alert' ? '🚨' : 'ℹ️'}
              </span>
              <p className="text-sm font-medium">{notificationToast.message}</p>
            </div>
          )}

          {/* Main Workspace Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            {activeTab === 'admin' && (
              <AdminDashboardView
                kindergartens={kindergartens}
                aides={aides}
                childrenData={children}
                recommendations={recommendations}
                isOptimizing={isOptimizing}
                runOptimizationAlgorithm={runOptimizationAlgorithm}
                handleApproveMatch={handleApproveMatch}
                systemLogs={systemLogs}
                kpis={{ totalActiveAides, availableForRelocation, totalShortages, relocatedToday, moneySavedToday }}
              />
            )}

            {activeTab === 'parent' && (
              <ParentPortalView
                childrenData={children}
                kindergartens={kindergartens}
                onReportAbsence={handleReportAbsence}
              />
            )}

            {activeTab === 'aide' && (
              <AideMobileView
                aides={aides}
                kindergartens={kindergartens}
                childrenData={children}
                onConfirmArrival={handleAideConfirmArrival}
              />
            )}

            {activeTab === 'academic' && (
              <AcademicProjectOverview />
            )}
          </main>

          {/* Clean Academic Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            פרויקט סיום לתואר ראשון במדעי המחשב / הנדסת מערכות מידע — פותח בהתאמה לדרישות רשויות מקומיות ומשרד החינוך
          </footer>
        </div>
      );
    }

    function AdminDashboardView({
      kindergartens,
      aides,
      childrenData,
      recommendations,
      isOptimizing,
      runOptimizationAlgorithm,
      handleApproveMatch,
      systemLogs,
      kpis,
    }) {
      const [filterZone, setFilterZone] = useState('all');
      const [selectedKindergarten, setSelectedKindergarten] = useState(null);

      const filteredKindergartens = useMemo(() => {
        if (filterZone === 'all') return kindergartens;
        return kindergartens.filter(k => k.zone.includes(filterZone));
      }, [kindergartens, filterZone]);

      return (
        <div className="space-y-6">
          {/* Top KPI Cards Row */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <p className="text-xs font-medium text-slate-500">סך סייעות מוקצות</p>
                <h3 className="text-2xl font-black text-slate-900 mt-1">{kpis.totalActiveAides}</h3>
                <span className="text-[11px] text-emerald-600 font-medium">במצבת כוח אדם עירונית</span>
              </div>
              <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl font-bold">

    function GeminiMunicipalAssistant({ kindergartens, aides, childrenData, kpis }) {
      const [messages, setMessages] = useState([
        {
          sender: 'ai',
          text: 'שלום! אני עוזר ה-AI של אגף החינוך. אני מחובר לנתוני הסייעות והגנים בעיר בזמן אמת. כיצד אוכל לעזור לך הבוקר? (לדוגמה: "מה מצב החוסרים כרגע?", "הצע לי פתרון לגן רקפות")',
        }
      ]);
      const [inputPrompt, setInputPrompt] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSendMessage = async (customText = null) => {
        const textToSend = customText || inputPrompt;
        if (!textToSend.trim() || isLoading) return;

        const newMessages = [...messages, { sender: 'user', text: textToSend }];
        setMessages(newMessages);
        setInputPrompt('');
        setIsLoading(true);

        // Build context payload
        const systemStateSummary = {
          totalAides: aides.length,
          availableAides: aides.filter(a => a.status === 'available').map(a => ({ name: a.name, certs: a.certifications })),
          shortageKindergartens: kindergartens.filter(k => k.status === 'shortage').map(k => ({ name: k.name, zone: k.zone, requiredRole: k.requiredRole })),
          moneySavedToday: kpis.moneySavedToday,
        };

        const systemInstruction = `אתה עוזר AI מקצועי של מחלקת החינוך ברשות מקומית עבור מערכת SmartAide-Opt.
תפקידך לתת למנהל המחלקה תשובות תמציתיות, ברורות ומדויקות בעברית על בסיס מצב המערכת בזמן אמת.
נתוני המערכת הנוכחיים:
${JSON.stringify(systemStateSummary, null, 2)}
ענה בסגנון שירותי, מקצועי, והצע פתרונות פרקטיים מיידיים לסייעות חסרות וחיסכון כספי. שמור על תשובה ממוקדת עד 3-4 פסקאות קצרות.`;

        try {
          const apiKey = ""; // Canvas provides key at runtime
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const payload = {
            contents: [{ parts: [{ text: textToSend }] }],
            systemInstruction: { parts: [{ text: systemInstruction }] },
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          const candidate = result.candidates?.[0];
          const responseText = candidate?.content?.parts?.[0]?.text;

          if (responseText) {
            setMessages(prev => [...prev, { sender: 'ai', text: responseText }]);
          } else {
            // Intelligent fallback for offline / mock testing
            setMessages(prev => [
              ...prev,
              {
                sender: 'ai',
                text: `בהתבסס על ניתוח הנתונים כרגע: ישנם ${systemStateSummary.shortageKindergartens.length} גנים בחוסר, מתוכם גנים הזקוקים לסייעת רפואית. נכון לעכשיו יש ${systemStateSummary.availableAides.length} סייעות פנויות לאחר דיווחי הורים. מומלץ להפעיל את אלגוריתם הניוד החכם בלוח הבקרה כדי לסגור את החוסר המיידי.`
              }
            ]);
          }
        } catch (err) {
          // Graceful fallback
          setMessages(prev => [
            ...prev,
            {
              sender: 'ai',
              text: `ניתוח מערכת מקומי: נרשם חיסכון משוער של ₪${kpis.moneySavedToday} להיום. מומלץ לוודא קבלת אישורי הגעה מכלל הסייעות שנוידו בגנים הסמוכים.`
            }
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="flex flex-col h-full space-y-3">
          <div className="border-b border-slate-100 pb-2 flex items-center justify-between">
            <div>
              <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                <span>💬</span>
                <span>עוזר AI מנהלי (Gemini Flash)</span>
              </h2>
              <p className="text-xs text-slate-500">שאלות בשפה טבעית על חוסרים, ניוד וחיזויים</p>
            </div>
            <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              מחובר ל-API
            </span>
          </div>

          {/* Chat Messages */}
          <div className="h-64 overflow-y-auto space-y-2.5 p-2 bg-slate-50 rounded-xl border border-slate-100 text-xs">
            {messages.map((m, i) => (
              <div
                key={i}
                className={`flex flex-col ${m.sender === 'user' ? 'items-start' : 'items-end'}`}
              >
                <div
                  className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 leading-relaxed shadow-sm ${
                    m.sender === 'user'
                      ? 'bg-blue-600 text-white rounded-tr-none'
                      : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none'
                  }`}
                >
                  <p className="whitespace-pre-line">{m.text}</p>
                </div>
              </div>
            ))}
            {isLoading && (
              <div className="flex items-center gap-2 text-slate-400 text-xs p-2">
                <span className="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
                <span>Gemini מעבד נתונים ומנסח תשובה...</span>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>

          {/* Quick Prompts Suggestions */}

                </div>

                {/* Submit Action Button */}
                <button

    function AcademicProjectOverview() {
      return (
        <div className="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-8">
          <div className="border-b border-slate-100 pb-4">
            <span className="text-xs bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full">
              נספח אקדמי למרצים ולשופטי פרויקט גמר
            </span>
            <h2 className="text-2xl font-black text-slate-900 mt-2">
              SmartAide-Opt: ארכיטקטורת מערכת, מודלי AI ואופטימיזציה
            </h2>
            <p className="text-xs text-slate-500 mt-1">
              פרויקט גמר יישומי המשלב אופטימיזציה מבוססת אילוצים (Constraint Satisfaction Problem) ומודלי שפה גדולים (LLMs)
            </p>
          </div>

          {/* 4 Pillars of the Academic Project */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <span>🎯</span>
                <span>1. בעיית האופטימיזציה (Optimization & CSP)</span>
              </h3>
              <p className="text-xs text-slate-600 leading-relaxed">
                המערכת פותרת בעיית שידוך בזמן אמת (Bipartite Matching with Constraints):
              </p>
              <ul className="text-xs text-slate-600 list-disc list-inside space-y-1">
                <li><strong>אילוצים קשיחים (Hard Constraints):</strong> התאמת הסמכה רפואית/שילוב – סייעת ללא הכשרה רפואית לא תשובץ לילד הדורש טיפול מסכן חיים.</li>
                <li><strong>אילוצים רכים (Soft Constraints):</strong> מזעור מרחק גאוגרפי וזמן נסיעה בין גן המקור לגן היעד.</li>
              </ul>
            </div>

            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <span>📊</span>
                <span>2. חיזוי הסתברותי (Predictive Analytics)</span>
              </h3>
              <p className="text-xs text-slate-600 leading-relaxed">
                מודל חיזוי המבוסס על נתוני היעדרויות היסטוריים, משתנים סביבתיים (עונות שנה, ימי שבוע, גלי תחלואה מקומיים). המודל מפיק התראת סיכון מוקדמת המאפשרת לאגף החינוך לשריין סייעות תגבור לפני תחילת יום הלימודים.
              </p>
            </div>

            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <span>🤖</span>
                <span>3. שילוב LLM (Google Gemini Flash)</span>
              </h3>
              <p className="text-xs text-slate-600 leading-relaxed">
                עוזר מנהלי הפועל בעברית טבעית מעל מצב המערכת בזמן אמת (Context Grounding). במקום להסתבך עם פילטרים ומסדי נתונים, המנהל מקבל תובנות אסטרטגיות ופתרונות מיידיים בשפה חופשית.
              </p>
            </div>

            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
              <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                <span>🔒</span>
                <span>4. פרטיות ואנונימיזציה (GDPR & Data Privacy)</span>
              </h3>
              <p className="text-xs text-slate-600 leading-relaxed">
                המערכת פועלת תחת אנונימיזציה מלאה (Data Masking). ה-AI ושרתי הענן מקבלים אך ורק מזהים מופשטים (למשל: <code>Child_102</code> עם צורך <code>Medical_Type_A</code>), ללא שמות פרטיים, תעודות זהות או חשיפת מידע רפואי רגיש של קטינים.
              </p>
            </div>
          </div>

          {/* Economic ROI Calculation */}
          <div className="bg-blue-50 border border-blue-200 rounded-2xl p-5 space-y-2">
            <h3 className="text-sm font-bold text-blue-950">💡 הערכת חיסכון כלכלי (ROI לרשות מקומית):</h3>
            <p className="text-xs text-blue-800 leading-relaxed">
              ברשות מקומית ממוצעת עם 120 סייעות שילוב, נרשמת היעדרות ממוצעת של 8-12% מהתלמידים מדי יום. ניוד חוזר של 8 סייעות ביום במקום שכירת סייעות מחליפות חיצוניות (בעלות ממוצעת של כ-₪480 ליום) מניב <strong>חיסכון עירוני ישיר של מעל ₪800,000 בשנה</strong>, בנוסף לשמירה על רציפות טיפולית ומניעת ביטול ימי לימודים.
            </p>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
