    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c * 10) / 10;
    }

        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) {

        return INITIAL_INSTITUTIONS;
      });

      useEffect(() => {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(institutions));
      }, [institutions]);

      const [selectedInstitution, setSelectedInstitution] = useState(null);
      const [filterNeighborhood, setFilterNeighborhood] = useState('all');
      const [filterType, setFilterType] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      // מודלים
      const [modalType, setModalType] = useState(null); // 'student' | 'aide' | 'relocate' | null
      const [activeAideToRelocate, setActiveAideToRelocate] = useState(null);

      // שדות טופס דיווח הורים

      const [absenceReason, setAbsenceReason] = useState('מחלה');
      const [absenceUntil, setAbsenceUntil] = useState('22/09');
      const [idLast4, setIdLast4] = useState('');
      const [authError, setAuthError] = useState('');

      const [notificationToast, setNotificationToast] = useState(null);

      // מפת Leaflet
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);

      const showToast = (msg) => {
        setNotificationToast(msg);
        setTimeout(() => setNotificationToast(null), 4000);
      };

      // איפוס נתוני הדגמה
      const handleResetData = () => {
        if (confirm('האם לאפס את כל הנתונים לברירת המחדל של קריית ביאליק?')) {
          localStorage.removeItem(LOCAL_STORAGE_KEY);
          setInstitutions(INITIAL_INSTITUTIONS);
          showToast('הנתונים אופסו בהצלחה לברירת המחדל');
        }
      };

      // אתחול המפה
      useEffect(() => {
        if (!mapInstanceRef.current && mapContainerRef.current) {
          const map = L.map(mapContainerRef.current, {
            zoomControl: true,
            scrollWheelZoom: true
          }).setView([32.8340, 35.0880], 14);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors | קריית ביאליק',
            maxZoom: 18,
          }).addTo(map);

          markersLayerRef.current = L.layerGroup().addTo(map);
          mapInstanceRef.current = map;
        }

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      // ציור המרקרים במפה
      useEffect(() => {
        if (!mapInstanceRef.current || !markersLayerRef.current) return;
        markersLayerRef.current.clearLayers();

        institutions.forEach(inst => {
          const matchNeighborhood = filterNeighborhood === 'all' || inst.neighborhood === filterNeighborhood;
          const matchType = filterType === 'all' || inst.type === filterType;
          const matchStatus = filterStatus === 'all' || inst.status === filterStatus;
          const matchSearch = 
            inst.name.includes(searchQuery) ||
            inst.street.includes(searchQuery) ||
            inst.aideName.includes(searchQuery) ||
            inst.studentOrTarget.includes(searchQuery);

          if (!matchNeighborhood || !matchType || !matchStatus || !matchSearch) return;

          let colorClass = 'pin-green';
          let symbol = '✓';
          if (inst.status === 'shortage') {
            colorClass = 'pin-red';
            symbol = '!';

            </div>

          markersLayerRef.current.addLayer(marker);

        setInstitutions(prev => prev.map(item => {

            };

        const aideMsg = `בוקר טוב ${sourceInst.aideName}, התלמיד ב${sourceInst.name} נעדר היום. שובצת לתגבור ב${targetInst.type} "${targetInst.name}" ברחוב ${targetInst.street} (${targetInst.neighborhood}). איש קשר: ${targetInst.leadStaff}, טלפון: ${targetInst.staffPhone}. יום מוצלח!`;
        const aideWaUrl = `https://wa.me/972${sourceInst.aidePhone.replace(/[^0-9]/g, '').slice(1)}?text=${encodeURIComponent(aideMsg)}`;

        // הודעה 2: לגננת המקבלת
        const staffMsg = `בוקר טוב ${targetInst.leadStaff}, נסגר החוסר להיום ב${targetInst.name}! הסייעת ${sourceInst.aideName} מגיעה אליכם לסיוע (טלפון: ${sourceInst.aidePhone}). יום שקט ומוצלח!`;
        const staffWaUrl = `https://wa.me/972${targetInst.staffPhone.replace(/[^0-9]/g, '').slice(1)}?text=${encodeURIComponent(staffMsg)}`;

        window.open(aideWaUrl, '_blank');
        setTimeout(() => window.open(staffWaUrl, '_blank'), 1000);

        showToast(`השיבוץ בוצע! נפתחו הודעות WhatsApp לסייעת ולגננת.`);
        setModalType(null);
      };

      // אישור הגעה של הסייעת
      const handleCheckIn = (instId) => {
        setInstitutions(prev => prev.map(inst => {
          if (inst.id === instId) {
            return { ...inst, confirmedArrival: true };
          }
          return inst;
        }));
        showToast('אישור הגעה עודכן במערכת העירונית בהצלחה!');
      };

      // ייצוא דוח יומי לאקסל (CSV)
      const exportDailyReportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "סוג,שם מוסד,שכונה,כתובת,צוות מוביל,טלפון צוות,סייעת,טלפון סייעת,הסמכת סייעת,תלמיד/ייעוד,סטטוס,אישור הגעה,הערות היעדרות\n";

        institutions.forEach(i => {
          const row = [
            i.type,
            i.name,
            i.neighborhood,
            i.street,
            i.leadStaff,
            i.staffPhone,
            i.aideName,
            i.aidePhone,
            i.aideCert === 'medical' ? 'רפואית' : 'שילוב',
            i.studentOrTarget,
            i.status === 'shortage' ? 'חוסר' : i.status === 'freed' ? 'פנויה לניוד' : 'מאוזן',
            i.confirmedArrival ? 'הגיעה' : 'טרם אישרה',
            `"${i.absenceDetail || ''}"`
          ];
          csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `דוח_ניוד_קריית_ביאליק_${new Date().toLocaleDateString('he-IL').replace(/\./g, '_')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('דוח אקסל יומי הופק והורד בהצלחה!');
      };

      // רשימת גנים חסרים ממוינים לפי מרחק והתאמה
      const smartShortageMatches = useMemo(() => {
        if (!activeAideToRelocate) return [];
        
        const shortages = institutions.filter(i => i.status === 'shortage');
        return shortages.map(target => {
          const dist = calculateDistance(activeAideToRelocate.lat, activeAideToRelocate.lng, target.lat, target.lng);
          const certMatch = activeAideToRelocate.aideCert === target.requiredCert || activeAideToRelocate.aideCert === 'medical'; // סייעת רפואית יכולה לשמש גם שילוב
          return {
            ...target,
            distanceKm: dist,
            certMatch
          };
        }).sort((a, b) => {
          if (a.certMatch && !b.certMatch) return -1;
          if (!a.certMatch && b.certMatch) return 1;
          return a.distanceKm - b.distanceKm; // הקרוב ביותר ראשון
        });
      }, [institutions, activeAideToRelocate]);

      // סינון הרשימה בטבלה
      const filteredList = useMemo(() => {
        return institutions.filter(inst => {
          const matchNeighborhood = filterNeighborhood === 'all' || inst.neighborhood === filterNeighborhood;
          const matchType = filterType === 'all' || inst.type === filterType;
          const matchStatus = filterStatus === 'all' || inst.status === filterStatus;
          const matchSearch = 
            inst.name.includes(searchQuery) ||
            inst.street.includes(searchQuery) ||
            inst.aideName.includes(searchQuery) ||
            inst.studentOrTarget.includes(searchQuery) ||
            inst.leadStaff.includes(searchQuery);
          return matchNeighborhood && matchType && matchStatus && matchSearch;
        });
      }, [institutions, filterNeighborhood, filterType, filterStatus, searchQuery]);

      const balancedCount = institutions.filter(i => i.status === 'balanced').length;
      const shortageCount = institutions.filter(i => i.status === 'shortage').length;
      const freedCount = institutions.filter(i => i.status === 'freed').length;

                </button>
              </div>
            </div>
          </header>

          {notificationToast && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-2xl border border-blue-400 flex items-center gap-2 animate-bounce">

          {/* Split 50% / 50% */}

                </div>

                  <select

              <div className="flex-1 overflow-auto">

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">עד איזה תאריך?</label>
                    <input
                      type="text"
                      value={absenceUntil}
                      onChange={(e) => setAbsenceUntil(e.target.value)}
                      placeholder="לדוגמה: 22/09"
                      className="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 font-medium"
                    />
                  </div>

                  {/* אימות מהיר ללא סיסמה */}
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <label className="font-bold text-slate-800 block mb-1">
                      🔒 אימות הורה (4 ספרות אחרונות של ת"ז הילד/ה):
                    </label>
                    <input
                      type="password"
                      maxLength="4"
                      value={idLast4}
                      onChange={(e) => setIdLast4(e.target.value)}
                      placeholder="••••"
                      className="w-full border border-slate-300 rounded-xl p-2.5 bg-white text-center font-bold tracking-widest text-base"
                    />
                    {authError && <p className="text-rose-600 font-bold text-[11px] mt-1">{authError}</p>}
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition"
                  >
                    אמת דיווח ושחרר סייעת לניוד עירוני
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: Aide Absence Report */}
          {modalType === 'aide' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-fadeIn">
                <div className="flex items-center justify-between border-b pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">👩‍🏫</span>
                    <h3 className="font-bold text-base text-slate-900">דיווח צוות: היעדרות סייעת</h3>
                  </div>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <form onSubmit={handleAideReportSubmit} className="space-y-3.5 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">בחר/י מוסד וסייעת:</label>
                    <select
                      value={reportedInstId}
                      onChange={(e) => setReportedInstId(e.target.value)}
                      className="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 font-medium"
                    >
                      {institutions.map(i => (
                        <option key={i.id} value={i.id}>
                          {i.aideName} ({i.type} {i.name} - {i.neighborhood})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">סיבת ההיעדרות:</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['מחלה', 'חופשה', 'אחר'].map(reason => (
                        <button
                          key={reason}
                          type="button"
                          onClick={() => setAbsenceReason(reason)}
                          className={`py-2 rounded-xl font-bold border transition ${
                            absenceReason === reason ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-50 text-slate-700'
                          }`}
                        >
                          {reason}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">היעדרות צפויה עד:</label>
                    <input
                      type="text"
                      value={absenceUntil}
                      onChange={(e) => setAbsenceUntil(e.target.value)}
                      placeholder="לדוגמה: 21/09"
                      className="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 font-medium"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow-lg transition"
                  >
                    עדכן חוסר במוסד (סמן באדום)
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: Smart Match Relocation Dialog (Sorted by Distance & Certification) */}
          {modalType === 'relocate' && activeAideToRelocate && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 animate-fadeIn">
                <div className="flex items-center justify-between border-b pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-900 flex items-center gap-1.5">
                      <span>שיבוץ חכם לסייעת:</span>
                      <span className="text-blue-600">{activeAideToRelocate.aideName}</span>
                    </h3>
                    <p className="text-xs text-slate-500">
                      מוסד מקור: {activeAideToRelocate.name} ({activeAideToRelocate.neighborhood}) • הסמכה: <strong>{activeAideToRelocate.aideCert === 'medical' ? 'רפואית' : 'שילוב'}</strong>
                    </p>
                  </div>
                  <button onClick={() => setModalType(null)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="space-y-2.5 text-xs max-h-96 overflow-y-auto pr-1">
                  <span className="font-bold text-slate-700 block">
                    מוסדות חסרים ממוינים לפי מרחק גאוגרפי והתאמת הסמכה:
                  </span>
                  
                  {smartShortageMatches.length === 0 ? (
                    <div className="p-4 bg-emerald-50 text-emerald-800 rounded-2xl text-center font-bold">
                      🎉 כל הגנים ובתי הספר בקריית ביאליק מאוישים כעת במלואם!
                    </div>
                  ) : (
                    smartShortageMatches.map(matchInst => (
                      <div
                        key={matchInst.id}
                        className={`border rounded-2xl p-3 flex items-center justify-between transition ${
                          matchInst.certMatch ? 'bg-white border-slate-200 hover:border-blue-400' : 'bg-amber-50/50 border-amber-200'
                        }`}
                      >
                        <div className="space-y-0.5">
                          <div className="flex items-center gap-2">
                            <h4 className="font-bold text-slate-900 text-sm">{matchInst.type} {matchInst.name}</h4>
                            <span className="text-[10px] bg-slate-100 text-slate-700 px-1.5 py-0.2 rounded font-bold">
                              {matchInst.distanceKm} ק"מ
                            </span>
                            {matchInst.certMatch ? (
                              <span className="text-[10px] bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded font-bold">
                                התאמת הסמכה מלאה ✓
                              </span>
                            ) : (
                              <span className="text-[10px] bg-rose-100 text-rose-800 px-1.5 py-0.2 rounded font-bold">
                                דורש הסמכה רפואית! ⚠️
                              </span>
                            )}
                          </div>
                          <p className="text-slate-500">{matchInst.street} ({matchInst.neighborhood})</p>
                          <p className="text-rose-600 font-medium text-[11px]">{matchInst.absenceDetail}</p>
                          <p className="text-slate-600 text-[11px]">איש קשר: {matchInst.leadStaff} ({matchInst.staffPhone})</p>
                        </div>

                        <button
                          onClick={() => handleDirectRelocation(activeAideToRelocate, matchInst)}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-2 rounded-xl shadow transition text-xs flex items-center gap-1.5 whitespace-nowrap"
                        >
                          <span>שבץ ושלח WhatsApp</span>
                          <span>🚀</span>
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
